[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infineon-fastreflex-e84"
version = "0.0.0"
description = "Deployment workspace for FastReflex on PSoC Edge E84"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

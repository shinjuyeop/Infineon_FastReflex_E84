[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infineon-fastreflex-e84"
version = "0.0.0"
description = "Deployment workspace for FastReflex on PSoC Edge E84"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6",
  "torch>=2.2",
]

[project.optional-dependencies]
m2 = [
  "ai-edge-litert>=2.1,<2.2",
  "ethos-u-vela>=4.2,<4.4",
  "tensorflow>=2.19,<2.20",
]
test = ["pytest>=6.2"]
hil = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

; Target parameters copied from the Vela configuration distributed in
; ModusToolbox Machine Learning Pack 3.0.0.2416.  The source file carries the
; Arm Apache-2.0 notice; only the PSE84 profile used by this repository is kept.

[System_Config.PSE8x_U55_400MHz_SOCMEM_200MHz_QUAD_XIP]
core_clock=400e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=0.47
Sram_burst_length=64
Sram_read_latency=12
Sram_write_latency=12
Sram_max_reads=8
Sram_max_writes=8
OffChipFlash_clock_scale=0.025
OffChipFlash_burst_length=128
OffChipFlash_read_latency=100
OffChipFlash_write_latency=100
OffChipFlash_max_reads=4
OffChipFlash_max_writes=0

[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0

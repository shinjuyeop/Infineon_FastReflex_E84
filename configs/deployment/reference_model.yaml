  result_path: reports/generated/int8_quantization_parity.json
  threshold: 0.99
  persistence_samples: 5
  calibration_policy:
    symmetric_absolute_percentile: 99.0
    rationale: >-
      A per-tensor INT8 input cannot spend nearly all codes on the rare extreme
      tail retained in the Research artifact. A symmetric TRAIN-only 99th
      absolute-percentile range is a standard model-blind robust range: it
      preserves sign symmetry, covers 99 percent of representative elements,
      and its numeric bound depends only on the frozen TRAIN values rather than
      golden outputs or member results.
  numerical_contract:
    input_saturation_fraction_maximum: 0.0002
    member_probability_median_absolute_error_maximum: 0.00390625
    member_probability_maximum_absolute_error_maximum: 0.10
    ensemble_probability_p95_absolute_error_maximum: 0.05
    ensemble_probability_maximum_absolute_error_maximum: 0.10
    ensemble_probability_absolute_bias_maximum: 0.01
    rationale: >-
      Median member error is limited to one INT8 softmax output quantum. The
      broader gates independently reject recurrent excursions above ten
      probability points, a p95 ensemble error above five points, and systematic
      ensemble bias above one point. These round semantic budgets are stricter
      than the observed unstable members, are not inherited from Float, and do
      not waive the separate exact decision requirement.
  target:
    accelerator_config: ethos-u55-128
    generic_system_config: Ethos_U55_High_End_Embedded
